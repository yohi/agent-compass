name: Monitor official guidance
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: official-guidance-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python compass.py validate
      - run: python compass.py render --check
      - run: python -m unittest discover -s tests -v
      - name: Fetch and report guidance changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set +e
          python compass.py github-monitor --repo "$REPOSITORY"
          monitor_status=$?
          python discovery.py --repo "$REPOSITORY"
          discovery_status=$?
          if [ "$monitor_status" -ne 0 ] || [ "$discovery_status" -ne 0 ]; then
            exit 1
          fi
