name: Validate prepared adoption
run-name: Adoption validation PR ${{ inputs.proposal_pr }} ${{ inputs.prepared_head }} ${{ inputs.expected_master }} ${{ inputs.nonce }}
on:
  workflow_dispatch:
    inputs:
      proposal_pr:
        required: true
        type: string
      prepared_head:
        required: true
        type: string
      expected_master:
        required: true
        type: string
      nonce:
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
  issues: read
jobs:
  validate:
    if: github.repository == 'yohi/agent-compass' && github.ref == 'refs/heads/master' && github.actor == 'github-actions[bot]' && github.triggering_actor == 'github-actions[bot]' && github.sha == inputs.expected_master
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate exact prepared adoption
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          PROPOSAL_PR: ${{ inputs.proposal_pr }}
          PREPARED_HEAD: ${{ inputs.prepared_head }}
          EXPECTED_MASTER: ${{ inputs.expected_master }}
        run: python auto_adoption.py --validate-prepared
