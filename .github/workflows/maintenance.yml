name: Maintain knowledge candidates
on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent-compass-knowledge-maintenance
  cancel-in-progress: false
jobs:
  maintenance:
    if: github.ref == 'refs/heads/master' && github.repository == 'yohi/agent-compass'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python compass.py validate
      - run: python -m unittest discover -s tests -v
      - name: Analyze public sources and propose updates
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED }}
        run: python maintenance.py --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
